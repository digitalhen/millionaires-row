# Production stack for Dokploy (one per instance).
# The app + its own Postgres, seeded from data/seed/mrow.dump on first boot.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://millionairesrownyc.com}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    environment:
      DATABASE_URL: postgres://mrow:${POSTGRES_PASSWORD:-mrow}@postgres:5432/mrow
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    # /api/health answers 200 whenever the process can serve, reporting the
    # database separately in its body — restarting the app would not fix a
    # Postgres outage, so it must not be what turns the container unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Dokploy attaches its Traefik to this port.
    expose:
      - "3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrow}
      POSTGRES_DB: mrow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrow -d mrow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: restores the seed dump whenever the committed dump differs from
  # what the database was last seeded with, then exits. The checksum of the
  # restored dump lives in the database itself (`seed_version`), so pushing a
  # new data/seed/mrow.dump and redeploying is the whole refresh procedure —
  # no volume drops, no manual DROP TABLE. `--clean --if-exists
  # --single-transaction` swaps the data atomically: readers see the old roll
  # until the commit, never a half-restored one. `seed_version` is created
  # here rather than shipped in the dump, so `--clean` never drops it.
  seed:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-mrow}
    volumes:
      - ./data/seed:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        WANT=$$(sha256sum /seed/mrow.dump | cut -d' ' -f1)
        HAVE=$$(psql -h postgres -U mrow -d mrow -tAc "SELECT checksum FROM seed_version" 2>/dev/null || true)
        if [ "$$WANT" = "$$HAVE" ]; then
          echo "seed: database already at $$WANT, skipping"
        else
          echo "seed: restoring /seed/mrow.dump ($$WANT, was $${HAVE:-empty})"
          pg_restore -h postgres -U mrow -d mrow \
            --clean --if-exists --single-transaction --no-owner --no-acl \
            /seed/mrow.dump
          psql -h postgres -U mrow -d mrow -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS seed_version (checksum text NOT NULL);
             TRUNCATE seed_version; INSERT INTO seed_version VALUES ('$$WANT');"
          echo "seed: done"
        fi

volumes:
  pgdata:
